<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Omni-Wheel Cyberpunk Controller</title>
    <!-- MQTT.js Cloud Library -->
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <style>
        :root {
            --bg-dark: #05080c;
            --card-bg: rgba(10, 18, 26, 0.88);
            --card-border: rgba(6, 182, 212, 0.35);
            --neon-cyan: #06b6d4;
            --neon-green: #10b981;
            --neon-red: #f43f5e;
            --neon-amber: #f59e0b;
            --text-main: #f0fdfa;
            --text-sub: #64748b;
            --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: radial-gradient(circle at center, #0c1822 0%, #030609 100%);
            font-family: var(--font-family);
            color: var(--text-main);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Cyber Background Overlay */
        body::before {
            content: "";
            position: absolute;
            width: 200%;
            height: 200%;
            top: -50%;
            left: -50%;
            background-image: 
                radial-gradient(rgba(6, 182, 212, 0.08) 1px, transparent 0);
            background-size: 28px 28px;
            pointer-events: none;
            z-index: 0;
        }

        /* Main Controller Card */
        .controller-card {
            position: relative;
            z-index: 10;
            width: 92%;
            max-width: 380px;
            padding: 24px 20px;
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--card-border);
            border-radius: 28px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.9), 0 0 35px rgba(6, 182, 212, 0.15);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }

        /* Header Title & Badge */
        .header-title {
            font-size: 15px;
            font-weight: 900;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: var(--neon-cyan);
            display: flex;
            align-items: center;
            gap: 8px;
            text-shadow: 0 0 12px rgba(6, 182, 212, 0.5);
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            background: rgba(244, 63, 94, 0.15);
            color: var(--neon-red);
            border: 1px solid rgba(244, 63, 94, 0.35);
            transition: all 0.3s ease;
        }

        .status-badge.connected {
            background: rgba(16, 185, 129, 0.15);
            color: var(--neon-green);
            border-color: rgba(16, 185, 129, 0.45);
            box-shadow: 0 0 15px rgba(16, 185, 129, 0.25);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: currentColor;
            box-shadow: 0 0 8px currentColor;
        }

        /* Mode & Speed Bar */
        .mode-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            padding: 8px 12px;
        }

        .mode-label {
            font-size: 11px;
            font-weight: 600;
            color: var(--text-sub);
        }

        .speed-selector {
            display: flex;
            gap: 6px;
        }

        .speed-pill {
            padding: 4px 10px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: var(--text-sub);
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .speed-pill.active {
            background: var(--neon-cyan);
            color: #000;
            border-color: var(--neon-cyan);
            box-shadow: 0 0 10px rgba(6, 182, 212, 0.4);
        }

        /* Directional Pad Container */
        .dpad-container {
            display: grid;
            grid-template-columns: repeat(3, 80px);
            grid-template-rows: repeat(3, 80px);
            gap: 12px;
            margin: 6px 0;
        }

        .dpad-btn {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 20px;
            color: var(--text-main);
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
            transition: all 0.1s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.4);
            position: relative;
            overflow: hidden;
        }

        .dpad-btn span {
            font-size: 10px;
            color: var(--text-sub);
            font-weight: 700;
        }

        .dpad-btn:hover {
            background: rgba(6, 182, 212, 0.15);
            border-color: var(--neon-cyan);
        }

        /* Active Hold Driving Glow State */
        .dpad-btn:active, .dpad-btn.active {
            background: var(--neon-cyan) !important;
            color: #000 !important;
            transform: scale(0.92) !important;
            box-shadow: 0 0 25px var(--neon-cyan), 0 0 50px rgba(6, 182, 212, 0.4) !important;
        }

        .dpad-btn.active span {
            color: #000 !important;
        }

        .dpad-stop {
            background: rgba(244, 63, 94, 0.12);
            border-color: rgba(244, 63, 94, 0.35);
            color: var(--neon-red);
        }

        .dpad-stop:active, .dpad-stop.active {
            background: var(--neon-red) !important;
            color: #fff !important;
            box-shadow: 0 0 25px var(--neon-red) !important;
        }

        /* Action Controls Group */
        .action-group {
            display: flex;
            gap: 10px;
            width: 100%;
        }

        .action-btn {
            flex: 1;
            padding: 12px;
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-main);
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: all 0.15s ease;
        }

        .action-btn.auto-btn {
            border-color: rgba(16, 185, 129, 0.4);
            color: var(--neon-green);
        }

        .action-btn.stop-btn {
            border-color: rgba(244, 63, 94, 0.4);
            color: var(--neon-red);
            background: rgba(244, 63, 94, 0.1);
        }

        .action-btn:active {
            transform: scale(0.95);
        }

        .serial-btn {
            width: 100%;
            padding: 11px;
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: var(--text-sub);
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: all 0.2s ease;
        }

        .key-guide {
            font-size: 10px;
            color: var(--text-sub);
            text-align: center;
            line-height: 1.5;
        }

        .key-guide strong {
            color: var(--neon-cyan);
        }
    </style>
</head>
<body>

    <!-- Centered Cyberpunk Gamepad Card -->
    <div class="controller-card">

        <!-- Title & Status -->
        <div class="header-title">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                <circle cx="12" cy="12" r="10"></circle>
                <path d="M12 8v8M8 12h8"></path>
            </svg>
            OMNI-WHEEL CONTROLLER
        </div>

        <div id="status-badge" class="status-badge">
            <span class="status-dot"></span>
            <span id="status-text">CONNECTING CLOUD...</span>
        </div>

        <!-- Speed Level Selection Bar -->
        <div class="mode-bar">
            <span class="mode-label">⚡ DRIVE SPEED</span>
            <div class="speed-selector">
                <button class="speed-pill" data-speed="1">1x</button>
                <button class="speed-pill active" data-speed="3">2x</button>
                <button class="speed-pill" data-speed="5">3x</button>
                <button class="speed-pill" data-speed="7">MAX</button>
            </div>
        </div>

        <!-- Cross D-Pad Buttons (Hold-To-Drive Mode) -->
        <div class="dpad-container">
            <div></div>
            <button id="btn-up" class="dpad-btn" title="Forward (Hold W)">▲<span>W (전진)</span></button>
            <div></div>

            <button id="btn-left" class="dpad-btn" title="Left Strafe (Hold A)">◀<span>A (좌)</span></button>
            <button id="btn-stop" class="dpad-btn dpad-stop" title="Stop">🛑<span>STOP</span></button>
            <button id="btn-right" class="dpad-btn" title="Right Strafe (Hold D)">▶<span>D (우)</span></button>

            <div></div>
            <button id="btn-down" class="dpad-btn" title="Backward (Hold S)">▼<span>S (후진)</span></button>
            <div></div>
        </div>

        <!-- Action Buttons -->
        <div class="action-group">
            <button id="btn-auto" class="action-btn auto-btn">🤖 Auto Roam [I]</button>
            <button id="btn-stop-all" class="action-btn stop-btn">⏹ Emergency [O]</button>
        </div>

        <!-- Backup USB Cable Connect -->
        <button id="btn-connect" class="serial-btn">
            🔌 USB Serial Connect (Local Backup)
        </button>

        <!-- Operating Instructions -->
        <div class="key-guide">
            <strong>Hold-to-Drive Active</strong>: Move ONLY while holding button/key.<br>
            Release button or key to Stop immediately.
        </div>

    </div>

    <!-- Application Script -->
    <script src="app.js"></script>
</body>
</html>
